<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة القيادة | برق المتعلم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDocs, getDoc, collection, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCMGTyYYPJg7F3oVtm0hJcIlFqiiPRllfQ",
    authDomain: "najran-university-app.firebaseapp.com",
    projectId: "najran-university-app",
    storageBucket: "najran-university-app.firebasestorage.app",
    messagingSenderId: "791769102695",
    appId: "1:791769102695:web:48925a5045fb1a09bc17c2"
};

const app = initializeApp(firebaseConfig);
window.db = getFirestore(app);
window.doc = doc; window.setDoc = setDoc; window.getDocs = getDocs; window.getDoc = getDoc;
window.collection = collection; window.query = query; window.orderBy = orderBy;
window.dispatchEvent(new Event('firebaseReady'));
</script>

<style>
:root { --primary: #2563EB; --bg-color: #0B1120; --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --text-main: #F3F4F6; --text-muted: #9CA3AF; --danger: #EF4444; --success: #10B981; }
* { margin:0; padding:0; box-sizing:border-box; font-family:'IBM Plex Sans Arabic',sans-serif; }
body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 40px 20px; }

.container { width: 100%; max-width: 1000px; }
.glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25); }

h1, h2, h3 { font-weight: 800; margin-bottom: 20px; }
.header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
.stat-card { background: rgba(37, 99, 235, 0.1); border: 1px solid rgba(37, 99, 235, 0.3); border-radius: 15px; padding: 20px; text-align: center; }
.stat-value { font-size: 2.5rem; font-weight: 800; color: #60A5FA; margin-bottom: 5px; }
.stat-label { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }

table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { padding: 15px; text-align: right; border-bottom: 1px solid var(--glass-border); }
th { color: var(--primary); font-weight: 800; }
tr:hover { background: rgba(255,255,255,0.02); }

.form-group { margin-bottom: 15px; text-align: right; }
label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--text-muted); }
input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: var(--text-main); font-size: 1rem; }

button { padding: 10px 20px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; }
.btn-danger { background: var(--danger); }
.btn-success { background: var(--success); }
.btn-primary { background: var(--primary); width: 100%; }
.btn-danger:hover { background: #DC2626; }
.btn-success:hover { background: #059669; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }

.pulse-anim { animation: pulse 2s infinite ease-in-out; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
</style>
</head>
<body>

<div id="toast" class="toast">تم الحفظ بنجاح ✅</div>

<div class="container">
    <div class="header-flex">
        <h1>لوحة تحكم <span style="color:#60A5FA;">المشرفين</span> ⚡</h1>
        <button class="btn-success" onclick="loadData()">تحديث البيانات 🔄</button>
    </div>

    <!-- الإحصائيات -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="total-users">0</div>
            <div class="stat-label">إجمالي الطلاب المسجلين</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="total-hours">0</div>
            <div class="stat-label">إجمالي ساعات التركيز للمنصة</div>
        </div>
    </div>

    <!-- قسم إضافة وتعديل الجامعات -->
    <div class="glass-panel">
        <h2>إدارة الجامعات والكليات والتخصصات 🏛️</h2>
        <div class="form-group">
            <label>اختر الجامعة أو أضف جديدة</label>
            <input type="text" id="uni-name" placeholder="اسم الجامعة (مثال: جامعة نجران)">
        </div>
        <div class="form-group">
            <label>اسم الكلية</label>
            <input type="text" id="college-name" placeholder="اسم الكلية (مثال: الهندسة)">
        </div>
        <div class="form-group">
            <label>التخصصات (افصل بينها بفواصل , )</label>
            <input type="text" id="majors-list" placeholder="هندسة ميكانيكية, هندسة مدنية, هندسة كهربائية">
        </div>
        <button class="btn-primary" onclick="saveUniversityData()">إضافة أو تحديث في النظام 💾</button>
    </div>

    <!-- جدول المستخدمين -->
    <div class="glass-panel">
        <h2>سجل الطلاب المسجلين</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>المعرف (@)</th>
                        <th>الجامعة / الكلية / التخصص</th>
                        <th>أيام الستريك</th>
                        <th>ساعات التركيز</th>
                        <th>إجراءات الإدارة</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="6" style="text-align:center;" class="pulse-anim">جاري تحميل أساطير المنصة...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
window.addEventListener('firebaseReady', () => { loadData(); });

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg || 'تم الحفظ بنجاح ✅';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

async function loadData() {
    try {
        const usersSnap = await window.getDocs(window.query(window.collection(window.db, "users"), window.orderBy("currentStreak", "desc")));
        
        let totalUsers = 0, totalMins = 0, html = '';

        usersSnap.forEach(docSnap => {
            const u = docSnap.data();
            const id = docSnap.id;
            totalUsers++;
            totalMins += (u.totalFocusMins || 0);

            let hours = ((u.totalFocusMins || 0) / 60).toFixed(1);
            let uniPath = (u.university || 'غير محدد') + ' <br><small style="color:var(--text-muted);">' + (u.college || '') + ' - ' + (u.major || '') + '</small>';

            html += `
                <tr>
                    <td style="font-weight:bold;">${u.name || 'مجهول'}</td>
                    <td dir="ltr" style="text-align:right; color:#60A5FA;">${u.handle || '---'}</td>
                    <td>${uniPath}</td>
                    <td style="font-weight:bold; color:#F59E0B;">🔥 ${u.currentStreak || 0}</td>
                    <td>${hours} س</td>
                    <td>
                        <button class="btn-danger" onclick="banUser('${id}', '${u.name}')">حظر 🚫</button>
                        <button class="btn-success" onclick="unbanUser('${id}', '${u.name}')" style="margin-right:5px;">فك ✅</button>
                    </td>
                </tr>
            `;
        });

        document.getElementById('total-users').innerText = totalUsers;
        document.getElementById('total-hours').innerText = (totalMins / 60).toFixed(1);
        document.getElementById('users-table-body').innerHTML = html || '<tr><td colspan="6" style="text-align:center;">لا توجد بيانات.</td></tr>';

    } catch(e) { console.error(e); }
}

// حفظ بيانات الجامعات في فايربيس
window.saveUniversityData = async function() {
    const uni = document.getElementById('uni-name').value.trim();
    const college = document.getElementById('college-name').value.trim();
    const majorsInput = document.getElementById('majors-list').value.trim();

    if(!uni || !college || !majorsInput) return alert('يرجى تعبئة جميع الحقول!');

    const majorsArray = majorsInput.split(',').map(m => m.trim()).filter(m => m.length > 0);

    try {
        // جلب البيانات الحالية من قاعدة البيانات إن وجدت
        const docRef = window.doc(window.db, "settings", "universities");
        const docSnap = await window.getDoc(docRef);
        
        let uniData = docSnap.exists() ? docSnap.data() : {};

        if(!uniData[uni]) uniData[uni] = {};
        uniData[uni][college] = majorsArray;

        await window.setDoc(docRef, uniData);
        showToast('تمت إضافة الجامعة/الكلية بنجاح وتحديثها للطلاب فوراً! 🎓');
        
        document.getElementById('college-name').value = '';
        document.getElementById('majors-list').value = '';
    } catch(e) {
        console.error(e);
        alert('حدث خطأ أثناء الحفظ');
    }
}

window.banUser = async function(id, name) {
    if(confirm(`حظر الطالب (${name})؟`)) {
        await window.setDoc(window.doc(window.db, "banned_users", id), { banned: true });
        showToast('تم الحظر 🚫');
    }
}
window.unbanUser = async function(id, name) {
    if(confirm(`فك الحظر عن (${name})؟`)) {
        await window.setDoc(window.doc(window.db, "banned_users", id), { banned: false });
        showToast('تم فك الحظر ✅');
    }
}
</script>
</body>
</html>
